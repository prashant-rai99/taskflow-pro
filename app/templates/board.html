<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TaskFlow Pro</title>
    <link rel="stylesheet" href="/static/board.css">
</head>

<body x-data="board()" x-init="loadTasks()">

    <header>
        <h1>TaskFlow Pro</h1>
        <div class="header-actions">
            <button @click="showBreakdownForm = true">✨ Generate from Feature</button>
            <button @click="showCriticalPath()">🎯 Critical Path</button>
            <button @click="showCreateForm = true">+ New Task</button>
        </div>
    </header>

    <!-- Critical Path Banner -->
    <div x-show="criticalPathData" class="critical-path-banner">
        <span><strong>Critical Path:</strong> <span x-text="criticalPathSummary"></span>
            (<span x-text="criticalPathData ? criticalPathData.total_duration_days : ''"></span> days)</span>
        <button @click="criticalPathData = null" class="cp-close">×</button>
    </div>

    <!-- Create Task Modal -->
    <div x-show="showCreateForm" class="modal-backdrop" @click.self="showCreateForm = false">
        <div class="modal">
            <h3>New Task</h3>
            <input type="text" x-model="newTask.title" placeholder="Task title">
            <textarea x-model="newTask.description" placeholder="Description"></textarea>
            <label>Planned Start</label>
            <input type="date" x-model="newTask.planned_start">
            <label>Duration (days)</label>
            <input type="number" x-model.number="newTask.duration_days" min="1">
            <div class="modal-actions">
                <button @click="showCreateForm = false">Cancel</button>
                <button @click="createTask()">Create</button>
            </div>
        </div>
    </div>

    <!-- Breakdown Generator Modal -->
    <div x-show="showBreakdownForm" class="modal-backdrop" @click.self="showBreakdownForm = false">
        <div class="modal">
            <h3>Generate Sub-tasks from Feature</h3>
            <textarea x-model="breakdownDescription"
                placeholder="Describe a feature, e.g. 'Add payment gateway integration with Stripe'"
                rows="4"></textarea>
            <label>Planned Start</label>
            <input type="date" x-model="breakdownStartDate">
            <div x-show="breakdownLoading" class="loading-text">Generating sub-tasks...</div>
            <div class="modal-actions">
                <button @click="showBreakdownForm = false">Cancel</button>
                <button @click="submitBreakdown()" :disabled="breakdownLoading">Generate</button>
            </div>
        </div>
    </div>

    <!-- Suggestions Panel -->
    <div x-show="showSuggestionsPanel" class="modal-backdrop" @click.self="showSuggestionsPanel = false">
        <div class="modal wide">
            <h3>AI Suggestions for "<span x-text="suggestionsForTaskTitle"></span>"</h3>
            <div x-show="suggestionsLoading" class="loading-text">Asking AI for suggestions...</div>
            <div x-show="!suggestionsLoading && currentSuggestions.length === 0" class="empty-text">
                No confident suggestions found.
            </div>
            <template x-for="s in currentSuggestions" :key="s.id">
                <div class="suggestion-card">
                    <div><strong x-text="'Depends on: ' + s.prerequisite_title"></strong></div>
                    <div class="suggestion-reason" x-text="s.reason"></div>
                    <div class="suggestion-evidence">Evidence: "<span x-text="s.evidence"></span>"</div>
                    <div class="suggestion-confidence" x-text="'Confidence: ' + s.confidence + '%'"></div>
                    <div class="suggestion-actions">
                        <button @click="rejectSuggestion(s.id)" class="btn-reject">Reject</button>
                        <button @click="approveSuggestion(s.id)" class="btn-approve">Approve</button>
                    </div>
                </div>
            </template>
            <div class="modal-actions">
                <button @click="showSuggestionsPanel = false">Close</button>
            </div>
        </div>
    </div>

    <!-- Explain Blocked Panel -->
    <div x-show="showExplainPanel" class="modal-backdrop" @click.self="showExplainPanel = false">
        <div class="modal">
            <h3 x-text="explainData.task_title + ' -- Status Explanation'"></h3>
            <p x-text="explainData.explanation"></p>
            <template x-if="explainData.blocking_reasons && explainData.blocking_reasons.length > 0">
                <ul class="blocking-list">
                    <template x-for="r in explainData.blocking_reasons" :key="r.prerequisite_id">
                        <li>
                            <strong x-text="r.prerequisite_title"></strong>
                            is currently in <span x-text="r.current_column"></span>
                        </li>
                    </template>
                </ul>
            </template>
            <div class="modal-actions">
                <button @click="showExplainPanel = false">Close</button>
            </div>
        </div>
    </div>

    <!-- Add Dependency Modal -->
    <div x-show="showDepForm" class="modal-backdrop" @click.self="showDepForm = false">
        <div class="modal">
            <h3>Add dependency</h3>
            <p><strong x-text="depTaskTitle"></strong> depends on:</p>
            <select x-model="depPrereqId">
                <option value="">Select prerequisite task</option>
                <template x-for="t in availablePrereqs()" :key="t.id">
                    <option :value="t.id" x-text="t.title"></option>
                </template>
            </select>
            <div class="modal-actions">
                <button @click="showDepForm = false">Cancel</button>
                <button @click="addDependency()">Add</button>
            </div>
        </div>
    </div>

    <div class="board">
        <template x-for="col in columns" :key="col.key">
            <div class="column">
                <h2 x-text="col.label"></h2>
                <div class="card-list" :data-column="col.key">
                    <template x-for="task in tasksByColumn(col.key)" :key="task.id">
                        <div class="card" :data-task-id="task.id"
                            :class="'status-' + task.status + (criticalPathTaskIds.includes(task.id) ? ' on-critical-path' : '')">
                            <div class="card-title" x-text="task.title"></div>
                            <div class="card-status-row">
                                <span class="card-status" x-text="task.status" @click="explainStatus(task.id)"></span>
                            </div>
                            <div class="card-dates">
                                <span x-text="task.computed_start"></span> →
                                <span x-text="task.computed_end"></span>
                            </div>
                            <div class="card-actions">
                                <button @click="suggestDependencies(task.id)" class="card-btn">🔗 Suggest</button>
                                <button @click="whatIfPreview(task.id)" class="card-btn">🔮 What-if</button>
                                <button @click="openDependencyForm(task.id)" class="card-btn">⛓ Depends on</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <script src="/static/board.js?v=2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js"></script>
</body>

</html>
